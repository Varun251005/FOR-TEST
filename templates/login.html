<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - FOR-TEST | AI-IDS-IPS Testing Environment</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page-container">
    <div class="card">
      <header class="brand-header">
        <div class="brand-badge">FOR-TEST</div>
        <h1 class="brand-title">AI-IDS-IPS Testing Environment</h1>
        <p class="brand-subtitle">Sign in to continue</p>
      </header>

      {% if error %}
      <div class="alert alert-error" role="alert">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form action="{{ url_for('login') }}" method="POST" novalidate>
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-input"
            placeholder="Enter username"
            required
            autocomplete="username"
            autofocus
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="Enter password"
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>

      <footer class="card-footer-notice">
        <div class="notice-badge">Controlled Security Testing Environment</div>
        <p class="notice-text">This application is intended for authorized laboratory testing.</p>
      </footer>
    </div>
  </div>
</body>
</html>
